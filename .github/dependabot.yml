# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    # Leave a range alone while it still admits the new release; only update it when a
    # release falls outside it (e.g. a new major version). The lower bounds are kept at
    # the oldest versions tested in CI. (`widen` is not accepted for the pip ecosystem.)
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
  - package-ecosystem: "pre-commit" # Bumps `rev` of the hooks in .pre-commit-config.yaml (Ruff)
    directory: "/"
    schedule:
      interval: "weekly"
