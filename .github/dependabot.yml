# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# `cooldown` delays version updates so that a bad release can be withdrawn before auto-merge takes it;
# see "Dependabot auto-merge" in SECURITY.md. `commit-message` makes pip and Docker updates `fix(deps)`, which
# release-please releases (at once; see "Release automation" in SECURITY.md), and keeps pre-commit, Actions and npm
# updates `build(deps)`, which change nothing that is distributed and release nothing.
version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    # Leave a range alone while it still admits the new release; only update it when a
    # release falls outside it (e.g. a new major version). (`widen` is not accepted for
    # the pip ecosystem.)
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "fix"
      include: "scope"
  - package-ecosystem: "pre-commit" # Bumps `rev` of the hooks in .pre-commit-config.yaml (Ruff, numpydoc, typos, Betterleaks)
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
      include: "scope"
  # Bumps in sphinx-pages-build.yml need its trusted template to land first, in a separate PR.
  # See "Updating GHPages action pins" in CONTRIBUTING.md; rebase the bump once it has landed.
  - package-ecosystem: "github-actions" # Keep immutable action pins current
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "fix"
      include: "scope"
  # The CI-only fixture that runs the real Release Please engine; nothing in it is distributed.
  - package-ecosystem: "npm"
    directory: "/tests/tools/release-please-fixture"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build"
      include: "scope"
    # The engine must match the one bundled in the pinned googleapis/release-please-action, so it moves only with
    # that pin; see "Release automation" in CONTRIBUTING.md. Its own dependencies still update.
    ignore:
      - dependency-name: "release-please"
