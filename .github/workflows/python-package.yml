# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTest

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  python-support:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      minimum: ${{ steps.python.outputs.minimum }}
      latest: ${{ steps.python.outputs.latest }}
      matrix: ${{ steps.python.outputs.matrix }}
      integrations: ${{ steps.python.outputs.integrations }}
      integration-matrix: ${{ steps.python.outputs.integration-matrix }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"

  lint:
    permissions:
      contents: read
    # Runs the hooks of .pre-commit-config.yaml, so CI uses the same Ruff version as the local git hook.
    # Kept out of the test matrix so that lint failures are reported quickly.
    runs-on: ubuntu-latest
    needs: python-support
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ needs.python-support.outputs.latest }}
    - name: Cache pre-commit environments
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Lint and check formatting with ruff
      env:
        RUFF_OUTPUT_FORMAT: github  # annotate violations on the PR diff
      run: |
        python -m pip install pre-commit
        # rules and line length are configured in [tool.ruff] of pyproject.toml
        pre-commit run --all-files --show-diff-on-failure
    - name: Test dependency lifecycle tooling
      run: python -m unittest discover -s tools/tests -v

  lowest:
    permissions:
      contents: read
    # Installs the lower bounds of [project].dependencies on the oldest supported Python,
    # to check that the declared ranges really work (the `build` job only tests the latest versions).
    runs-on: ubuntu-latest
    needs: python-support
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ needs.python-support.outputs.minimum }}
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        # A bare venv has no setuptools, so a dependency that needs pkg_resources at import time fails here
        uv venv --python ${{ needs.python-support.outputs.minimum }}
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the lowest direct dependencies
      run: |
        # lightning and mlflow are extras, but their lower bounds are checked as well
        uv pip install --resolution lowest-direct '.[lightning,mlflow]'
        # Keep the resolved versions while adding the optional dependencies and test tools
        uv pip freeze | grep -v '^pytorch-bsf' > lowest-constraints.txt
        uv pip install '.[all]' pytest pytest-cov hypothesis -c lowest-constraints.txt
        uv pip list
    - name: Test with pytest
      run: |
        pytest

  optional-deps:
    permissions:
      contents: read
    # Lightning, MLflow and the other extras are optional: check that the package imports and works without
    # them, and that the tests needing them are skipped rather than failing.
    # `absent` lists the packages that must not be installed in each configuration.
    name: optional-deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: python-support
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal  # `pip install pytorch-bsf` without any extra
            extras: ""
            absent: "lightning mlflow scipy sklearn matplotlib"
          - name: no-lightning  # every extra except lightning
            extras: "mlflow,sparse,sklearn,plot"
            absent: "lightning"
          - name: no-mlflow  # every extra except mlflow
            extras: "lightning,sparse,sklearn,plot"
            absent: "mlflow"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ needs.python-support.outputs.integrations }}
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        uv venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the package with the extras "${{ matrix.extras }}"
      run: |
        # The CPU build of PyTorch is much smaller than the default CUDA one
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        uv pip install ".${{ matrix.extras && format('[{0}]', matrix.extras) || '' }}" pytest pytest-cov hypothesis
        uv pip list
    - name: Check that the excluded packages are not installed
      run: |
        for module in ${{ matrix.absent }}; do
          if python -c "import $module" 2>/dev/null; then echo "$module must not be installed" >&2; exit 1; fi
        done
    - name: Check that importing torch_bsf imports neither Lightning nor MLflow
      run: |
        python -c "import sys, torch_bsf; assert not any(m.split('.')[0] in ('lightning', 'mlflow') for m in sys.modules)"
    - name: Run the CLI
      run: |
        python -m torch_bsf fit --params=params.csv --values=values.csv --degree=3 --save=model.bsf
    - name: Test with pytest
      run: |
        pytest

  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    needs: python-support
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python-support.outputs.matrix) }}
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov hypothesis
        python -m pip install -r docs/requirements.txt
    - name: Install integrations including MLflow
      if: contains(fromJSON(needs.python-support.outputs.integration-matrix), matrix.python-version)
      run: python -m pip install '.[lightning,mlflow]'
    - name: Install integrations without MLflow
      if: ${{ !contains(fromJSON(needs.python-support.outputs.integration-matrix), matrix.python-version) }}
      # MLflow's PyArrow constraints may lag new Python wheels.
      # environment.yml pins the last validated full-integration Python.
      run: python -m pip install '.[lightning,sparse,sklearn,plot]'
    - name: Type check with mypy
      run: |
        python -m pip install mypy types-PyYAML types-setuptools
        python -m mypy torch_bsf tests
    - name: Test with pytest
      run: |
        pytest
    - name: Upload coverage to Codecov
      if: matrix.python-version == needs.python-support.outputs.integrations
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
    - name: Test CLI samples
      env:
        MLFLOW_RUN_LOCAL: 1
      run: |
        bash examples/quickstart/run.sh

  distribution:
    permissions:
      contents: read
    # Build artifacts once, independently of the Python/optional-dependency matrices.
    runs-on: ubuntu-latest
    needs: python-support
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ needs.python-support.outputs.latest }}
    - name: Install build tools and runtime dependencies
      run: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install setuptools wheel .
    - name: Validate clean-source and sdist wheels outside the checkout
      run: python tools/check_distribution.py

  docs:
    permissions:
      contents: read
    # Validate the current checkout once; Pages separately builds historical refs.
    runs-on: ubuntu-latest
    needs: python-support
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ needs.python-support.outputs.integrations }}
    - name: Install documentation dependencies and all integrations
      run: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r docs/requirements.txt
        python -m pip install -e '.[all]'
    - name: Build HTML with warnings as errors
      run: python -m sphinx -b html -W --keep-going docs docs/_build/html
    - name: Run documentation examples with warnings as errors
      run: python -m sphinx -b doctest -W --keep-going docs docs/_build/doctest
