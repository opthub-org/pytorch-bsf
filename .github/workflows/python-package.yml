# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTest

on:
  push:

jobs:
  lint:
    # Runs the hooks of .pre-commit-config.yaml, so CI uses the same Ruff version as the local git hook.
    # Kept out of the test matrix so that lint failures are reported quickly.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Lint and check formatting with ruff
      env:
        RUFF_OUTPUT_FORMAT: github  # annotate violations on the PR diff
      run: |
        python -m pip install pre-commit
        # rules and line length are configured in [tool.ruff] of pyproject.toml
        pre-commit run --all-files --show-diff-on-failure

  lowest:
    # Installs the lower bounds of [project].dependencies on the oldest supported Python,
    # to check that the declared ranges really work (the `build` job only tests the latest versions).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        # A bare venv has no setuptools, so a dependency that needs pkg_resources at import time fails here
        uv venv --python 3.10
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the lowest direct dependencies
      run: |
        # lightning and mlflow are extras, but their lower bounds are checked as well
        uv pip install --resolution lowest-direct '.[lightning,mlflow]'
        # Keep the resolved versions while adding the optional dependencies and test tools
        uv pip freeze | grep -v '^pytorch-bsf' > lowest-constraints.txt
        uv pip install '.[all]' pytest pytest-cov -c lowest-constraints.txt
        uv pip list
    - name: Test with pytest
      run: |
        pytest

  optional-deps:
    # Lightning, MLflow and the other extras are optional: check that the package imports and works without
    # them, and that the tests needing them are skipped rather than failing.
    # `absent` lists the packages that must not be installed in each configuration.
    name: optional-deps (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal  # `pip install pytorch-bsf` without any extra
            extras: ""
            absent: "lightning mlflow scipy sklearn matplotlib"
          - name: no-lightning  # every extra except lightning
            extras: "mlflow,sparse,sklearn,plot"
            absent: "lightning"
          - name: no-mlflow  # every extra except mlflow
            extras: "lightning,sparse,sklearn,plot"
            absent: "mlflow"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        uv venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the package with the extras "${{ matrix.extras }}"
      run: |
        # The CPU build of PyTorch is much smaller than the default CUDA one
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        uv pip install ".${{ matrix.extras && format('[{0}]', matrix.extras) || '' }}" pytest pytest-cov
        uv pip list
    - name: Check that the excluded packages are not installed
      run: |
        for module in ${{ matrix.absent }}; do
          if python -c "import $module" 2>/dev/null; then echo "$module must not be installed" >&2; exit 1; fi
        done
    - name: Check that importing torch_bsf imports neither Lightning nor MLflow
      run: |
        python -c "import sys, torch_bsf; assert not any(m.split('.')[0] in ('lightning', 'mlflow') for m in sys.modules)"
    - name: Run the CLI
      run: |
        python -m torch_bsf fit --params=params.csv --values=values.csv --degree=3 --save=model.bsf
    - name: Test with pytest
      run: |
        pytest

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov
        python -m pip install -r docs/requirements.txt
        python -m pip install '.[lightning,mlflow]'
    - name: Type check with mypy
      run: |
        python -m pip install mypy types-PyYAML types-setuptools
        python -m mypy torch_bsf tests
    - name: Test with pytest
      run: |
        pytest
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
    - name: Test with doctest
      run: |
        sphinx-build -b doctest docs docs/_build/doctest
    - name: Test CLI samples
      env:
        MLFLOW_RUN_LOCAL: 1
      run: |
        bash examples/quickstart/run.sh
