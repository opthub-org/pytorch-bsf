# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: PyTest

on:
  push:

jobs:
  lint:
    # Runs the hooks of .pre-commit-config.yaml, so CI uses the same Ruff version as the local git hook.
    # Kept out of the test matrix so that lint failures are reported quickly.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Cache pre-commit environments
      uses: actions/cache@v4
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Lint and check formatting with ruff
      env:
        RUFF_OUTPUT_FORMAT: github  # annotate violations on the PR diff
      run: |
        python -m pip install pre-commit
        # rules and line length are configured in [tool.ruff] of pyproject.toml
        pre-commit run --all-files --show-diff-on-failure

  lowest:
    # Installs the lower bounds of [project].dependencies on the oldest supported Python,
    # to check that the declared ranges really work (the `build` job only tests the latest versions).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        # A bare venv has no setuptools, so a dependency that needs pkg_resources at import time fails here
        uv venv --python 3.10
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install the lowest direct dependencies
      run: |
        # lightning and mlflow are extras, but their lower bounds are checked as well
        uv pip install --resolution lowest-direct '.[lightning,mlflow]'
        # Keep the resolved versions while adding the optional dependencies and test tools
        uv pip freeze | grep -v '^pytorch-bsf' > lowest-constraints.txt
        uv pip install '.[all]' pytest pytest-cov -c lowest-constraints.txt
        uv pip list
    - name: Test with pytest
      run: |
        pytest

  no-mlflow:
    # MLflow is an optional extra (pytorch-bsf[mlflow]): the package and the CLI must work without it,
    # with the MLflow tests skipped.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install the package and the other extras without MLflow
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[lightning,sampling,sklearn,plot]' pytest pytest-cov
        if python -c "import mlflow" 2>/dev/null; then echo "mlflow must not be installed" >&2; exit 1; fi
    - name: Run the CLI without MLflow
      run: |
        python -m torch_bsf --params=params.csv --values=values.csv --degree=3
    - name: Test with pytest
      run: |
        pytest

  no-lightning:
    # Lightning is an optional extra that only solver="trainer" needs: check that the package imports and
    # works without it, and that the trainer tests are skipped rather than failing.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Create a virtual environment
      run: |
        python -m pip install uv
        uv venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Install without Lightning
      run: |
        uv pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Every extra except lightning
        uv pip install '.[mlflow,sampling,sklearn,plot]' pytest pytest-cov
        uv pip list
        if python -c "import lightning" 2>/dev/null; then echo "Lightning must not be installed" >&2; exit 1; fi
    - name: Check that importing torch_bsf does not import Lightning
      run: |
        python -c "import sys, torch_bsf; assert not any(m.startswith('lightning') for m in sys.modules)"
    - name: Test with pytest
      run: |
        pytest

  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        activate-environment: test-env
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov
        python -m pip install -r docs/requirements.txt
        python -m pip install '.[lightning,mlflow]'
    - name: Type check with mypy
      run: |
        python -m pip install mypy types-PyYAML types-setuptools
        python -m mypy torch_bsf tests
    - name: Test with pytest
      run: |
        pytest
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.14'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false
    - name: Test with doctest
      run: |
        sphinx-build -b doctest docs docs/_build/doctest
    - name: Test CLI samples
      env:
        MLFLOW_RUN_LOCAL: 1
      run: |
        bash examples/quickstart/run.sh
