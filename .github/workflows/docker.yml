name: Docker

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Published release tag to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag_name || github.event.release.tag_name }}
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/opthub-org/pytorch-bsf
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.tag_name || github.event.release.tag_name }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.event.release.tag_name }}
          type=sha
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
