name: Docker

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Published release tag to build
        required: true
        type: string

permissions: {}

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        ref: ${{ inputs.tag_name || github.event.release.tag_name }}
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/opthub-org/pytorch-bsf
        tags: |
          type=semver,pattern={{version}},value=${{ inputs.tag_name || github.event.release.tag_name }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name || github.event.release.tag_name }}
          type=sha
    - name: Build and push Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
