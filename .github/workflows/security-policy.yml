name: Security policy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test security automation trust boundaries and merge gates
        run: |
          python -m unittest discover -s tests/tools -p security_automation.py -v
          python -m unittest discover -s tests/tools -p dependabot_merge.py -v
      - name: Scan Actions privilege and injection boundaries
        run: |
          python -m pip install zizmor==1.31.1
          zizmor --min-severity medium .github/workflows

  pages-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Reject a producer change that the template on master does not trust
        run: |
          git fetch --quiet --depth=1 --no-tags origin refs/heads/master
          python tools/check_pages_producer.py FETCH_HEAD

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the scan walks the whole history of the checked-out commit
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Reject octopus merges, whose changes the scan below cannot read
        run: |
          if [ "$(git rev-list --min-parents=3 --count HEAD)" -ne 0 ]; then
            echo "::error::The history has a merge of three or more parents; see SECURITY.md"
            exit 1
          fi
      - name: Scan the git history for secrets with Betterleaks
        # The version is the `rev` of .pre-commit-config.yaml, which Dependabot bumps. SECURITY.md lists what the log can expose.
        run: |
          python -m pip install pre-commit==4.7.0
          pre-commit run betterleaks-history --hook-stage manual
