name: Conda

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        activate-environment: pytorch-bsf  # matches `name:` in environment.yml
        environment-file: environment.yml
    - name: Test with pytest
      run: |
        conda install pytest pytest-cov
        pytest
    - name: E2E test with conda
      run: |
        python -m torch_bsf --params=params.csv --values=values.csv --degree=3

  build-mlflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        activate-environment: test-env
        python-version: "3.14"
    - name: Install dependencies
      run: |
        # Install only mlflow; `mlflow run` below creates the full conda env from environment.yml
        conda install -c conda-forge mlflow
    - name: E2E test with MLflow
      run: |
        mlflow run https://github.com/opthub-org/pytorch-bsf --version ${{ github.sha }} -P params=params.csv -P values=values.csv -P degree=3
