name: Conda

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Miniforge
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        # Miniforge 26.9.4-0 fails `conda init --all` on Windows while replacing
        # Scripts/conda.exe ("needs sudo"). Keep the last passing installer there.
        miniforge-version: ${{ runner.os == 'Windows' && '26.7.2-1' || 'latest' }}
        channels: conda-forge
        conda-remove-defaults: "true"
        auto-update-conda: true
        activate-environment: pytorch-bsf  # matches `name:` in environment.yml
        environment-file: environment.yml
    - name: Check that pip did not replace conda packages
      # The `pip:` section of environment.yml installs pytorch-bsf only; a dependency taken from PyPI instead
      # means pip overrode a conda-forge package because of different metadata (#405).
      run: |
        conda list
        if conda list | awk '$NF == "pypi" && $1 != "pytorch-bsf" {found = 1; print} END {exit !found}'; then
          echo "pip replaced the conda packages above" >&2; exit 1
        fi
    - name: Test with pytest
      run: |
        conda install pytest pytest-cov hypothesis
        pytest
    - name: E2E test with conda
      run: |
        python -m torch_bsf fit --params=params.csv --values=values.csv --degree=3 --save=model.bsf

  build-mlflow:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"
    - name: Set up Miniforge
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: latest
        channels: conda-forge
        conda-remove-defaults: "true"
        auto-update-conda: true
        activate-environment: test-env
        python-version: ${{ steps.python.outputs.integrations }}
    - name: Install dependencies
      run: |
        # Install only mlflow; `mlflow run` below creates the full conda env from environment.yml
        conda install -c conda-forge mlflow
    - name: E2E test with MLflow
      run: |
        # Use the checked-out PR merge commit, including contributions from forks.
        mlflow run . -P params=params.csv -P values=values.csv -P degree=3
    - name: Check that pip did not replace conda packages in the MLflow environment
      run: |
        env_name=$(conda env list | awk '$1 ~ /^mlflow-/ {print $1; exit}')
        if [ -z "$env_name" ]; then echo "mlflow run created no mlflow-* environment" >&2; exit 1; fi
        conda list -n "$env_name"
        if conda list -n "$env_name" | awk '$NF == "pypi" && $1 != "pytorch-bsf" {found = 1; print} END {exit !found}'; then
          echo "pip replaced the conda packages above" >&2; exit 1
        fi

  docker-build:
    permissions:
      contents: read
    # Validate the Linux image on PRs without publishing release artifacts.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Build the unpinned Conda image
      run: docker build --tag pytorch-bsf:ci .
    - name: Import the installed numerical packages and run CLI help
      run: |
        docker run --rm pytorch-bsf:ci conda run --no-capture-output -n base python -c "import numpy, torch, torch_bsf"
        docker run --rm pytorch-bsf:ci conda run --no-capture-output -n base python -m torch_bsf --help
