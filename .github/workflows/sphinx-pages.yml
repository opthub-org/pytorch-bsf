name: GHPages

on:
 push:

permissions: {}

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"
    - name: Setup Python and Install Dependencies
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ steps.python.outputs.integrations }}
    - run: |
        pip install -r docs/requirements.txt

    - name: Build documentation with sphinx-multiversion
      # Historical tags retain their documentation sources and release metadata.
      # The PyTest docs job validates the current source with warnings as errors.
      run: |
        sphinx-multiversion docs/ docs/_build
    - name: Commit documentation changes
      run: |
        git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --branch gh-pages --single-branch gh-pages
        cp -r docs/_build/* gh-pages/
        cd gh-pages
        printf 'GitHub Pages of [%s](%s/%s)\n' "$GITHUB_REPOSITORY" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" > README.md
        echo "===" >> README.md
        printf 'Sphinx html documentation of [%s](%s/%s/tree/%s)\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> README.md
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit --allow-empty -m "From $GITHUB_REF $GITHUB_SHA"
    - name: Push changes
      uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
      with:
        branch: gh-pages
        directory: gh-pages
        github_token: ${{ secrets.GITHUB_TOKEN }}
