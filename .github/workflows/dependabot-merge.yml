name: Dependabot merge

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs only master's controller; PR metadata is data, never executed.
    workflows:
      - PyTest
      - Conda
      - CodeQL
      - Security policy
      - Release configuration
      - GHPages build
      - GHPages publisher
    types: [requested, completed]
  # Codecov reports codecov/patch as a check run, which starts no workflow_run.
  check_run:
    types: [completed]
  # Hold and release commands. Comments that the controller writes with GITHUB_TOKEN start no run.
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    # Recovers a dropped event and moves past deadlines. GitHub delays or drops these runs, often for hours,
    # and most at the start of an hour, so this avoids minute 0.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

# Each run re-reads all state, so keeping only the newest pending run loses nothing. A run whose job is skipped
# gets its own group, because a pending run that a newer one replaces is cancelled even if the newer one skips.
# The condition must match the job's `if`.
concurrency:
  group: >-
    ${{ (github.repository == 'opthub-org/pytorch-bsf' &&
    github.ref == 'refs/heads/master' &&
    (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
    (github.event_name == 'workflow_run' &&
    (github.event.workflow_run.name == 'GHPages publisher' ||
    startsWith(github.event.workflow_run.head_branch, 'dependabot/'))) ||
    (github.event_name == 'check_run' && github.event.check_run.app.slug == 'codecov' &&
    startsWith(github.event.check_run.check_suite.head_branch, 'dependabot/')) ||
    (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
    github.event.issue.user.login == 'dependabot[bot]' &&
    contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
    contains(github.event.comment.body, '/dependabot')))) && 'dependabot-merge' || format('dependabot-merge-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  reconcile:
    # The ref check keeps a dispatch from running another branch's controller with these permissions.
    # The publisher always runs on master, but it reports the `GHPages publish` check of the PR head.
    if: >-
      github.repository == 'opthub-org/pytorch-bsf' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.name == 'GHPages publisher' ||
      startsWith(github.event.workflow_run.head_branch, 'dependabot/'))) ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug == 'codecov' &&
      startsWith(github.event.check_run.check_suite.head_branch, 'dependabot/')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.issue.user.login == 'dependabot[bot]' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/dependabot')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      # The job runs only on master, so this SHA is the trusted default-branch commit, never a PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Merge or triage open Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_MERGE_ENABLED: ${{ vars.DEPENDABOT_MERGE_ENABLED }}
        run: python -m tools.dependabot_merge
