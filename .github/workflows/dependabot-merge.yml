name: Dependabot merge

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Runs only master's controller; PR metadata is data, never executed.
    workflows:
      - PyTest
      - Conda
      - CodeQL
      - Security policy
      - Release configuration
      - GHPages build
      - GHPages publisher
      - Release
    types: [requested, completed]
    # No run at all for other branches. master is listed for the GHPages publisher and Release, which updates the
    # release PR. codecov/patch and comments start no run: the controllers wait for codecov/patch within a run, and
    # read hold commands before every merge.
    branches: ['dependabot/**', 'release-please--**', master]
  schedule:
    # Moves past deadlines and recovers a dropped event. GitHub delays or drops these runs, often for hours, and most
    # at the start of an hour.
    - cron: '37 * * * *'
  workflow_dispatch:

permissions: {}

# Each run re-reads all state, so keeping only the newest pending run loses nothing. A run whose job is skipped
# gets its own group, because a pending run that a newer one replaces is cancelled even if the newer one skips.
# The condition must match the job's `if`.
concurrency:
  group: >-
    ${{ (github.repository == 'opthub-org/pytorch-bsf' &&
    github.ref == 'refs/heads/master' &&
    (github.event_name != 'workflow_run' ||
    github.event.workflow_run.name == 'GHPages publisher' ||
    github.event.workflow_run.name == 'Release' ||
    startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
    startsWith(github.event.workflow_run.head_branch, 'release-please--'))) && 'dependabot-merge' || format('dependabot-merge-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  reconcile:
    # The ref check keeps a dispatch from running another branch's controller with these permissions.
    # The publisher always runs on master, but it reports the `GHPages publish` check of the PR head. Release runs on
    # master and may update the release PR, whose new head the release controller then evaluates.
    if: >-
      github.repository == 'opthub-org/pytorch-bsf' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'GHPages publisher' ||
      github.event.workflow_run.name == 'Release' ||
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') ||
      startsWith(github.event.workflow_run.head_branch, 'release-please--'))
    runs-on: ubuntu-latest
    # In each step, sleeps alone can take CODECOV_WAIT_SECONDS plus one poll, and UNCOMPUTED_REREADS x
    # UNCOMPUTED_DELAY_SECONDS for each evaluation, twice for a PR that waited (tools/dependabot_merge.py): about 5.5
    # minutes, plus 30 seconds a PR.
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      contents: write
      issues: write
      pull-requests: write
      statuses: read
    steps:
      # The job runs only on master, so this SHA is the trusted default-branch commit, never a PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Merge or triage open Dependabot PRs
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDABOT_MERGE_ENABLED: ${{ vars.DEPENDABOT_MERGE_ENABLED }}
        run: python -m tools.dependabot_merge
      - name: Merge the release PR
        # Runs even when the Dependabot step fails, so that one controller's error does not hold back the other.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MERGE_ENABLED: ${{ vars.RELEASE_MERGE_ENABLED }}
          RELEASE_PLEASE_BOT: ${{ vars.RELEASE_PLEASE_BOT }}
        run: python -m tools.release_merge
