name: Release

on:
  push:
    branches:
    - master

permissions: {}

jobs:
  github-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
    - id: release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

  docker:
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository] -- Keep the same-commit reusable workflow syntax supported by actionlint.
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.github-release.outputs.tag_name }}

  pypi-build:
    permissions:
      contents: read
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        ref: ${{ needs.github-release.outputs.tag_name }}
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python.outputs.latest }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Store distributions for publication
      id: distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-distributions-${{ github.run_attempt }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  pypi:
    # Build backends and repository scripts run without publishing credentials.
    permissions:
      id-token: write
    needs: [github-release, pypi-build]
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-bsf
    steps:
    - name: Retrieve distributions from this release build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.pypi-build.outputs.artifact-id }}
        merge-multiple: true
        path: dist
        digest-mismatch: error
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true
