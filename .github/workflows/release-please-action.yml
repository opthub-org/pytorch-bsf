name: Release

on:
  push:
    branches:
    - master

permissions:
  contents: write
  pull-requests: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
    - id: release-please
      uses: google-github-actions/release-please-action@v3
      with:
        release-type: python
        package-name: torch_bsf
        # While the major version is 0, a breaking change bumps the minor version, not the major one
        bump-minor-pre-major: true

  docker:
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created }}
    # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.github-release.outputs.tag_name }}

  pypi:
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
