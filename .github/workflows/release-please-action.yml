name: Release

on:
  push:
    branches:
    - master
  workflow_dispatch:

permissions: {}

# Runs on `master` never overlap and start in the order of the pushes, and each reads `master` when it runs, so a run
# for an older commit cannot update the release PR after the run for a newer one. The release controller trusts a
# `release-pr` success on `master`'s head because of this. Only the newest waiting run is kept; one that a newer run
# replaces is for an older commit, and the newer run creates any release it would have created. The ref keeps a
# dispatch on another branch, whose jobs all skip, out of the group. Re-running an older run while a newer one waits
# cancels the newer one instead. If the controllers merged `master`'s head and every run on it was cancelled before any
# job ran, they dispatch Release again, at most MAX_REDISPATCHES times (tools/dependabot_merge.py), and that run in turn
# cancels the re-run if it still waits; so re-run an older run only while no run waits. Every job has a timeout, so that
# a run holds the group for about an hour at most, well within the two hours the release controller waits for
# `release-pr` (RELEASE_PR_GRACE).
# An approval wait on the `pypi` environment has no such limit, so that environment requires no reviewers.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
    # GITHUB_TOKEN creates the release, so that its tag and release events start no second publication; the jobs
    # below publish it.
    - id: release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        skip-github-pull-request: true

  # A release PR that GITHUB_TOKEN updates gets CI runs that wait for approval and never count as its required checks,
  # so the release App opens and updates it; see "Release App" in SECURITY.md. Without the App, GITHUB_TOKEN still
  # opens the PR, and the release controller stops it with that reason. No publishing job needs this job, so a
  # failure here, such as a revoked App key, cannot keep a created release from being published. It runs after the
  # release is created, so that release-please sees the merged release PR as released. The release controller finds
  # this job by its key (RELEASE_PR_JOB), so it sets no `name:`.
  release-pr:
    needs: github-release
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - id: app-token
      if: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - id: release-pr
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        token: ${{ steps.app-token.outputs.token || github.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
        skip-github-release: true

  docs:
    needs: github-release
    if: >-
      ${{ needs.github-release.outputs.release_created == 'true' &&
          !contains(needs.github-release.outputs.tag_name, '-') &&
          !contains(needs.github-release.outputs.tag_name, '+') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    # GITHUB_TOKEN-created tags do not trigger push workflows; dispatch does.
    # No checkout or release code runs with this dispatch-only token.
    - name: Dispatch documentation for the stable release tag
      env:
        GH_TOKEN: ${{ github.token }}
        DOCS_TAG: ${{ needs.github-release.outputs.tag_name }}
      run: |
        python3 -I - <<'PY'
        import json
        import os
        import re
        import subprocess

        tag = os.environ["DOCS_TAG"]
        if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
            raise SystemExit("Expected a stable documentation release tag")
        subprocess.run(
            ["gh", "api", "--method", "POST",
             "repos/opthub-org/pytorch-bsf/actions/workflows/sphinx-pages-build.yml/dispatches",
             "--input", "-"],
            input=json.dumps({"ref": tag}).encode(),
            check=True,
        )
        PY

  docker:
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository] -- Keep the same-commit reusable workflow syntax supported by actionlint.
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.github-release.outputs.tag_name }}

  pypi-build:
    permissions:
      contents: read
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.distributions.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ needs.github-release.outputs.tag_name }}
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python.outputs.latest }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Store distributions for publication
      id: distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-distributions-${{ github.run_attempt }}
        path: dist/*
        if-no-files-found: error
        retention-days: 7

  pypi:
    # Build backends and repository scripts run without publishing credentials.
    permissions:
      id-token: write
    needs: [github-release, pypi-build]
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-bsf
    steps:
    - name: Retrieve distributions from this release build
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.pypi-build.outputs.artifact-id }}
        merge-multiple: true
        path: dist
        digest-mismatch: error
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true
