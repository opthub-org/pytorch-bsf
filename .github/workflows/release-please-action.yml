name: Release

on:
  push:
    branches:
    - master

permissions: {}

jobs:
  github-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
    - id: release-please
      uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

  docker:
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository] -- Keep the same-commit reusable workflow syntax supported by actionlint.
    permissions:
      contents: read
      packages: write
    with:
      tag_name: ${{ needs.github-release.outputs.tag_name }}

  pypi:
    permissions:
      contents: read
    needs: github-release
    if: ${{ needs.github-release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        ref: ${{ needs.github-release.outputs.tag_name }}
    - name: Read supported Python versions from package metadata
      id: python
      run: python tools/update_python_support.py --ci-output "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.python.outputs.latest }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29 # zizmor: ignore[use-trusted-publishing] -- Configure the PyPI trusted publisher separately before removing the API token.
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
