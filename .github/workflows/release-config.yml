name: Release configuration

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  release-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: '24'
    - name: Install fixture dependencies without lifecycle scripts
      run: npm ci --prefix tests/tools/release-please-fixture --ignore-scripts --no-audit --no-fund
    - name: Check release policy and publication wiring without publishing
      run: npm test --prefix tests/tools/release-please-fixture
