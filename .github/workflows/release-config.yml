name: Release configuration

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  release-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Install fixture dependencies without lifecycle scripts
      run: npm ci --prefix tests/tools/release-please-fixture --ignore-scripts --no-audit --no-fund
    - name: Check release policy and publication wiring without publishing
      run: npm test --prefix tests/tools/release-please-fixture
