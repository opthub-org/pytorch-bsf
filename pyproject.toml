[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-bsf"
version = "0.22.0"
description = "PyTorch implementation of Bézier simploid fitting"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
  {name = "OptHub Inc. and FUJITSU LIMITED", email = "hmkz@s101.xrea.com"},
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Lower bounds are the oldest versions that pass the `lowest` job of .github/workflows/python-package.yml
# (see "Dependency versions" in CONTRIBUTING.md); do not raise them without a reason.
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.21.2,<3",
  "sympy>=1.12,<2",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/opthub-org/pytorch-bsf"

[project.optional-dependencies]
# Optional execution adapter; the numerical core does not require Lightning.
lightning = [
  "lightning>=2.4,<3",
]
# Experiment tracking of the CLI (python -m torch_bsf ...); without it, the CLI logs nothing.
# Its lower bound is checked by the `lowest` job as well.
mlflow = [
  "mlflow>=3.11.1,<4",
]
sparse = [
  "scipy",
]
sklearn = [
  "scikit-learn",
]
plot = [
  "matplotlib",
  "scipy",
]
all = [
  "lightning>=2.4,<3",
  "mlflow>=3.11.1,<4",
  "scipy",
  "scikit-learn",
  "matplotlib",
]
develop = [
  "pre-commit",
  "ruff",
  "pytest",
  "pytest-cov",
  "pytest-randomly",
  "pytest-benchmark",
  "hypothesis",
  "mypy",
  "types-PyYAML",
  "types-setuptools",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
exclude = ["build", "dist", "docs"]

[tool.pytest.ini_options]
addopts = """
  --verbose
  --assert=plain
  --durations=0
  --cov=torch_bsf
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --doctest-modules
  --junit-xml=pytest.xml
"""
testpaths = ["tests"]
python_files = ["*.py"]
python_functions = ["test_*", "_test_*"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "torch_bsf.solvers.DenseLeastSquares",
  "torch_bsf.core.QuadraticPenalty",
  "torch_bsf.optimization.PreconditionedSGD",
  "torch_bsf.model_selection._validation.KFold",
  "torch_bsf.splitting.LongestEdge",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true

# Tests are type-checked (including bodies of unannotated functions via
# check_untyped_defs), but test functions and fixtures need not be annotated.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sympy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true
