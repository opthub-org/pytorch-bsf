[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-bsf"
version = "0.24.0"
description = "PyTorch implementation of Bézier simploid fitting"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [
  {name = "OptHub Inc. and FUJITSU LIMITED", email = "hmkz@s101.xrea.com"},
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Lower bounds are the oldest versions that pass the `lowest` job of .github/workflows/python-package.yml
# (see "Dependency versions" in CONTRIBUTING.md); do not raise them without a reason.
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.23.2,<3",
  "sympy>=1.12,<2",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/opthub-org/pytorch-bsf"

[project.optional-dependencies]
# Optional execution adapter; the numerical core does not require Lightning.
lightning = [
  "lightning>=2.4,<3",
]
# Experiment tracking of the CLI (python -m torch_bsf ...); without it, the CLI logs nothing.
# Its lower bound is checked by the `lowest` job as well.
mlflow = [
  "mlflow>=3.11.1,<4",
]
sparse = [
  "scipy",
]
sklearn = [
  "scikit-learn",
]
plot = [
  "matplotlib",
  "scipy",
]
all = [
  "lightning>=2.4,<3",
  "mlflow>=3.11.1,<4",
  "scipy",
  "scikit-learn",
  "matplotlib",
]
develop = [
  "pre-commit",
  "ruff",
  "pytest",
  "pytest-cov",
  "diff-cover",
  "pytest-randomly",
  "pytest-benchmark",
  "hypothesis",
  "mypy",
  "types-PyYAML",
  "types-setuptools",
]

[tool.setuptools]
include-package-data = true
zip-safe = false
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["torch_bsf", "torch_bsf.*"]

[tool.pytest.ini_options]
addopts = """
  --verbose
  --assert=plain
  --durations=0
  --cov=torch_bsf
  --cov-report=term-missing
  --cov-report=html
  --cov-report=xml
  --doctest-modules
  --junit-xml=pytest.xml
"""
testpaths = ["tests"]
python_files = ["*.py"]
python_functions = ["test_*", "_test_*"]

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C90", "D", "PGH003", "PLC2401", "PLC2403", "TID251"]
ignore = [
  "D105",  # magic methods document themselves through the protocol they implement
  "D401",  # summaries may be descriptive ("Bézier simplex of ...") rather than imperative
]

[tool.ruff.lint.per-file-ignores]
# Docstring conventions apply to the package; tests, examples and docs scripts are exempt.
"!torch_bsf/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Write Python 3.10 built-in type hints and quote forward references instead (CONTRIBUTING.md, Style guidelines)."

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "torch_bsf.solvers.DenseLeastSquares",
  "torch_bsf.core.QuadraticPenalty",
  "torch_bsf.optimization.PreconditionedSGD",
  "torch_bsf.model_selection._validation.KFold",
  "torch_bsf.splitting.LongestEdge",
  "torch_bsf.interpolation.NoSplit",
  "torch_bsf.interpolation.C0",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
warn_redundant_casts = true

# Tests are type-checked (including bodies of unannotated functions via
# check_untyped_defs), but test functions and fixtures need not be annotated.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "mlflow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sympy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mpl_toolkits.*"
ignore_missing_imports = true

[tool.numpydoc_validation]
# Start with the checks on the structure of docstrings; the ones disabled below are enabled step by step in #561.
checks = [
  "all",
  "ES01",  # No extended summary found
  "EX01",  # No examples section found
  "GL08",  # The object does not have a docstring
  "PR01",  # Parameters not documented
  "PR04",  # Parameter has no type
  "RT01",  # No Returns section found
  "RT03",  # Return value has no description
  "SA01",  # See Also section not found
  "SS05",  # Summary must start with infinitive verb, not third person
]
# Private objects (_name), which include special methods (__name__); private modules are excluded in .pre-commit-config.yaml
exclude = ['\._\w*$']
