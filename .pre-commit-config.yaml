# pre-commit hooks: https://pre-commit.com/
# Install the git hook once per clone with `pre-commit install`; it also applies to all `git worktree`s of the clone.
# The Ruff version below is the single source of truth: CI runs these same hooks with `pre-commit run --all-files`,
# and Dependabot (`package-ecosystem: "pre-commit"` in .github/dependabot.yml) bumps `rev`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      # Lint and sort imports; rules are configured in [tool.ruff] of pyproject.toml
      - id: ruff-check
        args: [--fix]
      # Format code
      - id: ruff-format
