# Configuration for typos (https://github.com/crate-ci/typos).
# Prefer narrow exceptions (patterns, identifiers) over allowing a word everywhere:
# allowing "thm", "nd", "arange" or "sice" as words would hide real misspellings of "them", "and", "arrange" and "since".

[files]
extend-exclude = [
  "*.ico",
]

[default]
extend-ignore-re = [
  # Sphinx labels and references of theorems, e.g. ":label: thm-topos" and ":eq:`thm-topos`"
  "\\bthm-[\\w-]+",
  # Subscripts of torch.einsum, e.g. "nk,nkd->nd"
  "einsum\\(\\s*\"[^\"]*\"",
  # torch.arange and numpy.arange calls
  "\\barange\\(",
  # Abbreviated commit hashes in links generated by release-please
  "\\[[0-9a-f]{7}\\]\\(https://github\\.com/[^)]*/commit/[0-9a-f]{40}\\)",
  # Proper names in docs/refs.bib
  "\\(SICE\\)",
  "\\bO'Leary\\b",
]

[default.extend-identifiers]
# numpy.typing.NDArray
NDArray = "NDArray"
# The Clough-Tocher control point paired with e_ab in a comment of torch_bsf/interpolation.py
e_ba = "e_ba"
# A citation key in docs/refs.bib
sice_process_mpc = "sice_process_mpc"

[default.extend-words]
# An accepted spelling of "reparameterize", used by the public function torch_bsf.splitting.reparametrize and its tests
reparametrize = "reparametrize"
# Optimal Power Flow
OPF = "OPF"
